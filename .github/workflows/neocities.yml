name: "Deploy to Neocities"
on:
  push:
    branches:
      - v2
jobs:
  deploy:
    name: "Deploy to Neocities"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: "24"
          cache: npm
      - run: npm install
      - run: npm run build
      - uses: bcomnes/deploy-to-neocities@v1
        with:
          api_token: ${{ secrets.NEOCITIES_API_TOKEN }}
          dist_dir: "public/"
          cleanup: true